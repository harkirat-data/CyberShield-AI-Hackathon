<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" shape-rendering="crispEdges">
  <defs>
    <filter id="cyber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#22c55e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Cyber Shield / Badge Silhouette Background -->
  <!-- Top flat row with chamfered pixel corners -->
  <rect x="8" y="2" width="20" height="2" fill="#15803d"/>
  <rect x="5" y="4" width="26" height="2" fill="#16a34a"/>
  
  <!-- Outer glowing green pixel step border -->
  <rect x="3" y="6" width="30" height="18" fill="#090d16"/>
  <rect x="2" y="6" width="2" height="18" fill="#22c55e"/>
  <rect x="32" y="6" width="2" height="18" fill="#22c55e"/>
  
  <!-- Shield tapering steps down to point -->
  <rect x="5" y="24" width="26" height="2" fill="#090d16"/>
  <rect x="4" y="24" width="2" height="2" fill="#22c55e"/>
  <rect x="30" y="24" width="2" height="2" fill="#22c55e"/>

  <rect x="7" y="26" width="22" height="2" fill="#090d16"/>
  <rect x="6" y="26" width="2" height="2" fill="#22c55e"/>
  <rect x="28" y="26" width="2" height="2" fill="#22c55e"/>

  <rect x="9" y="28" width="18" height="2" fill="#090d16"/>
  <rect x="8" y="28" width="2" height="2" fill="#22c55e"/>
  <rect x="26" y="28" width="2" height="2" fill="#22c55e"/>

  <rect x="11" y="30" width="14" height="2" fill="#090d16"/>
  <rect x="10" y="30" width="2" height="2" fill="#22c55e"/>
  <rect x="24" y="30" width="2" height="2" fill="#22c55e"/>

  <rect x="13" y="32" width="10" height="2" fill="#090d16"/>
  <rect x="12" y="32" width="2" height="2" fill="#22c55e"/>
  <rect x="22" y="32" width="2" height="2" fill="#22c55e"/>

  <rect x="15" y="34" width="6" height="2" fill="#22c55e"/>

  <!-- Inner cyber gradient fill behind letters -->
  <rect x="4" y="6" width="28" height="18" fill="#0b1320"/>

  <!-- ======================================================== -->
  <!-- KARMATIC ARCADE 'CS' PIXEL ART (Large, Bold, High-Contrast) -->
  <!-- ======================================================== -->

  <!-- BLACK DROP-SHADOW / OUTLINE BEHIND 'C' & 'S' -->
  <g fill="#000000">
    <!-- C Outline/Shadow -->
    <rect x="7" y="9" width="11" height="14"/>
    <!-- S Outline/Shadow -->
    <rect x="18" y="9" width="12" height="14"/>
  </g>

  <!-- 'C' (Pure White Pixel Face) -->
  <g fill="#ffffff">
    <!-- C Top Bar -->
    <rect x="7" y="9" width="9" height="3"/>
    <rect x="14" y="12" width="2" height="2"/>
    <!-- C Left Column -->
    <rect x="5" y="11" width="4" height="9"/>
    <!-- C Bottom Bar -->
    <rect x="7" y="19" width="9" height="3"/>
    <rect x="14" y="17" width="2" height="2"/>
  </g>

  <!-- 'C' Inner Dark Hole -->
  <rect x="9" y="12" width="5" height="7" fill="#0b1320"/>

  <!-- 'S' (Pure White Pixel Face) -->
  <g fill="#ffffff">
    <!-- S Top Bar -->
    <rect x="19" y="9" width="9" height="3"/>
    <!-- S Upper Left Stem -->
    <rect x="17" y="11" width="4" height="4"/>
    <!-- S Middle Bar -->
    <rect x="19" y="14" width="8" height="3"/>
    <!-- S Lower Right Stem -->
    <rect x="25" y="16" width="4" height="4"/>
    <!-- S Bottom Bar -->
    <rect x="18" y="19" width="9" height="3"/>
    <!-- S Accent Nubs -->
    <rect x="26" y="11" width="2" height="2"/>
    <rect x="17" y="18" width="2" height="2"/>
  </g>

  <!-- S Inner Holes -->
  <rect x="21" y="12" width="5" height="2" fill="#0b1320"/>
  <rect x="19" y="17" width="6" height="2" fill="#0b1320"/>

  <!-- Cyber Green Corner Accent Pixels -->
  <rect x="5" y="6" width="2" height="2" fill="#4ade80"/>
  <rect x="29" y="6" width="2" height="2" fill="#4ade80"/>
  <rect x="17" y="4" width="2" height="2" fill="#4ade80"/>
</svg>